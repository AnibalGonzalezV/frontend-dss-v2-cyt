<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 40" fill="none">
  <!-- CII Concha y Toro Logo (Centro de Investigación e Innovación) -->
  <g id="cii-emblem">
    <!-- Innovation Node / Network Grape Hexagon -->
    <rect x="4" y="4" width="32" height="32" rx="7" fill="#18181B" stroke="#FE5000" stroke-width="1.2"/>
    <!-- Interconnected research nodes -->
    <circle cx="14" cy="14" r="3" fill="#FE5000"/>
    <circle cx="26" cy="14" r="3" fill="#BD532B"/>
    <circle cx="20" cy="24" r="3.5" fill="#FFFFFF"/>
    <path d="M14 14 L26 14 L20 24 Z" stroke="#FE5000" stroke-width="1.2"/>
    <path d="M20 27.5 L20 32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g id="cii-text">
    <text x="44" y="17" font-family="'Montserrat', 'Arial Black', Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5" fill="#18181B">
      CII
    </text>
    <text x="75" y="17" font-family="'Arial', sans-serif" font-size="8" font-weight="700" letter-spacing="0.5" fill="#BD532B">
      CENTRO DE INVESTIGACIÓN E INNOVACIÓN
    </text>
    <text x="44" y="31" font-family="'Cinzel', 'Times New Roman', serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#FE5000">
      VIÑA CONCHA Y TORO
    </text>
  </g>
</svg>
